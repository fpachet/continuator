[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuator"
version = "2.0.0"
description = "A project implementing a constrainable continuator."
authors = [
    { name = "François Pachet", email = "pachet@ynosound.com" },
]
requires-python=">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "mido ~= 1.3",
    "vo-regular-bp @ git+https://github.com/fpachet/vo-regular-bp.git@5e8526473af13ee1106d616410284fa01f2c6d54",
]

[project.optional-dependencies]
gradio = [
    "gradio",
    "matplotlib",
]
realtime-midi = [
    "python-rtmidi",
]
local-ui = [
    "gradio",
    "matplotlib",
    "python-rtmidi",
]
dev = [
    "pytest",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/ctor",
    "/midi_stuff",
    "/data",
    "/examples",
    "/docs",
    "/tests",
    "/benchmarks",
    "/scripts",
    "/AGENTS.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
[tool.hatch.build.targets.wheel]
packages = ["ctor", "midi_stuff"]

[tool.hatch.build.targets.sdist.force-include]
"data/prelude_c.mid" = "data/prelude_c.mid"
