[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuator"
version = "1.2.3"
description = "A project implementing a constrainable continuator."
authors = [
    { name = "François Pachet", email = "pachet@ynosound.com" },
]
requires-python=">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "mido ~= 1.3",
]

[project.optional-dependencies]
gradio = [
    "gradio",
    "matplotlib",
]
realtime-midi = [
    "python-rtmidi",
]
local-ui = [
    "gradio",
    "matplotlib",
    "python-rtmidi",
]
dev = [
    "pytest",
]

[tool.hatch.build.targets.sdist]
include = [
    "/ctor",
    "/midi_stuff",
    "/utils",
    "/data",
    "/examples",
    "/docs",
    "/AGENTS.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
[tool.hatch.build.targets.wheel]
packages = ["ctor", "midi_stuff", "utils"]
